<h4>Les5: Repeat some template code - Control Flow in Components - a+for</h4>
<p><i>* NOTE: the use of <u>track</u> is required, you may use the id or some other unique identifier.</i></p>
@for(os of operatingSystems; track os.id) {
    <p>OS: {{ os.name }}</p>
}
<ul>
    @for(u of users; track u.id) {
        <li>{{ u.name }}</li>    
    }
</ul>
